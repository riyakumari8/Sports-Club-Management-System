server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: clubsphere-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/clubsphere_db
    username: postgres
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  jackson:
    serialization:
      fail-on-empty-beans: false

# Security / JWT configuration
clubsphere:
  app:
    jwtSecret: "ClubSphereSuperSecretKeyForJwtAuthenticationTokens2026SecureLongStringKey!"
    jwtExpirationMs: 86400000 # 24 hours in milliseconds

# OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
