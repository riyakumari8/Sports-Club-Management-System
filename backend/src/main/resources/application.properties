# ============================================================
# ClubSphere Backend - Application Configuration
# ============================================================

# Server port — the backend runs on port 8080
server.port=8080

# ============================================================
# DATABASE CONFIGURATION
# Connect to the local PostgreSQL database named clubsphere_db
# ============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/clubsphere_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA / HIBERNATE CONFIGURATION
# validate = Hibernate checks tables exist but won't create/modify them
# (The database team handles schema creation via SQL files)
# ============================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ============================================================
# JWT SECURITY CONFIGURATION
# Secret key must be at least 32 characters for HS256 algorithm
# Expiration = 86400000 ms = 24 hours
# ============================================================
app.jwt.secret=clubsphere_jwt_secret_key_32bytes_min_longer_now
app.jwt.expiration=86400000

# ============================================================
# FILE UPLOAD LIMITS
# Allow product and menu item images up to 10MB
# ============================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ============================================================
# CORS CONFIGURATION
# Allow frontend (React on port 3000) to call our API
# ============================================================
app.cors.allowed-origins=http://localhost:3000

# ============================================================
# LOGGING
# Show DEBUG logs for our application code (helps during development)
# ============================================================
logging.level.com.clubsphere=DEBUG
logging.level.org.springframework.security=INFO

# ============================================================
# SPRINGDOC / SWAGGER UI
# Swagger docs available at: http://localhost:8080/swagger-ui.html
# ============================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
